name: release

# Builds the win_amd64 wheel and attaches it to the GitHub Release for a pushed
# tag (e.g. v22.1.7). Uses the built-in gh CLI + GITHUB_TOKEN — no third-party
# actions. Delete this workflow if the org restricts Actions and publish the
# wheel manually (`python -m build --wheel` then upload to the release).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
      - name: Publish wheel to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.whl --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" dist/*.whl --clobber
